plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeliteVersion').getOrElse('latest.release')
group = 'com.aerialfishingtracker'
version = '1.0.0'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

test { systemProperty 'java.awt.headless', 'true' }

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aerialfishingtracker.TrackerLauncher'
    jvmArgs '-ea'
    args '--developer-mode'
}

tasks.register('preview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.aerialfishingtracker.OverlayPreview'
    systemProperty 'java.awt.headless', 'true'
}
